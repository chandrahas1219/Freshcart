{% extends "base.html" %}
{% block title %}Edit {{ item.Name }} · FreshCart{% endblock %}
{% block content %}

<p class="font-mono text-xs tracking-widest text-basil-600 uppercase mb-2">Store office</p>
<h1 class="font-display text-3xl font-semibold text-basil-900 mb-6">Edit "{{ item.Name }}"</h1>

<div class="max-w-xl">
    <form method="POST" class="panel grid sm:grid-cols-2 gap-4">
        <div class="sm:col-span-2">
            <label class="field-label" for="name">Name</label>
            <input class="field-input" type="text" id="name" name="name" value="{{ item.Name }}" required>
        </div>
        <div>
            <label class="field-label" for="category">Category</label>
            <input class="field-input" type="text" id="category" name="category" value="{{ item.Category or '' }}">
        </div>
        <div>
            <label class="field-label" for="unit">Unit</label>
            <select class="field-input" id="unit" name="unit" required>
                {% for u in ['kg', 'litres', 'units'] %}
                    <option value="{{ u }}" {{ 'selected' if item.Unit == u else '' }}>{{ u }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="field-label" for="price">Price (₹)</label>
            <input class="field-input" type="number" id="price" name="price" min="0.01" step="0.01" value="{{ item.PricePerUnit }}" required>
        </div>
        <div>
            <label class="field-label" for="quantity">Quantity</label>
            <input class="field-input" type="number" id="quantity" name="quantity" min="1" value="{{ item.QuantityInStock }}" required>
        </div>
        <div class="sm:col-span-2">
            <label class="field-label" for="image_url">Image URL</label>
            <input class="field-input" type="url" id="image_url" name="image_url" value="{{ item.ImageURL or '' }}">
        </div>
        <div class="sm:col-span-2 flex gap-3">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{{ url_for('admin.inventory') }}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}

{% extends "base.html" %}
{% block title %}Profile · FreshCart{% endblock %}
{% block content %}

<p class="font-mono text-xs tracking-widest text-basil-600 uppercase mb-2">Shop</p>
<h1 class="font-display text-3xl font-semibold text-basil-900 mb-6">Your profile</h1>

<div class="grid sm:grid-cols-2 gap-5 max-w-3xl">
    <div class="panel">
        <h2 class="font-display text-lg font-semibold text-basil-900 mb-4">Account</h2>
        <form method="POST" class="space-y-4">
            <div>
                <label class="field-label" for="name">Name</label>
                <input class="field-input" type="text" id="name" name="name" value="{{ customer.Name }}" required>
            </div>
            <div>
                <label class="field-label" for="email">Email</label>
                <input class="field-input" type="email" id="email" name="email" value="{{ customer.Email }}" required>
            </div>
            <div>
                <label class="field-label" for="phone">Phone</label>
                <input class="field-input" type="tel" id="phone" name="phone" value="{{ customer.Phone or '' }}">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Save</button>
        </form>
    </div>

    <div class="panel">
        <h2 class="font-display text-lg font-semibold text-basil-900 mb-4">Password</h2>
        <form method="POST" action="{{ url_for('customer.change_password') }}" class="space-y-4">
            <div>
                <label class="field-label" for="current">Current</label>
                <input class="field-input" type="password" id="current" name="current_password" required>
            </div>
            <div>
                <label class="field-label" for="new">New</label>
                <input class="field-input" type="password" id="new" name="new_password" required minlength="6">
            </div>
            <div>
                <label class="field-label" for="confirm">Confirm</label>
                <input class="field-input" type="password" id="confirm" name="confirm_password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-secondary btn-block">Update</button>
        </form>
    </div>
</div>

{% endblock %}
